# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Minecraft / Fabric
# Minecraft has shipped unobfuscated since 26.1, so there is no mappings
# dependency any more: the names below are the real ones.
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.17.20
fabric_version=0.161.0+26.3

# Optional: set this to a Mod Menu build that exists for this Minecraft version to
# compile in the config-screen entrypoint. Empty means build without Mod Menu.
modmenu_version=

# Mod
mod_version=2.0.0+26.3
maven_group=dev.sosoph
archives_base_name=viewmodel
