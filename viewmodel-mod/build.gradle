plugins {
    // The no-remap Loom plugin. Minecraft ships unobfuscated since 26.1, so this is
    // the id to use: the old "fabric-loom" id is the remapping one and demands a
    // mappings dependency that no longer exists.
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// Mod Menu support is opt in: set modmenu_version in gradle.properties to a build
// that exists for this Minecraft version, and the entrypoint is compiled and
// registered. Left empty, the mod builds without it and opens with its keybind.
def modmenuVersion = (project.findProperty('modmenu_version') ?: '').toString().trim()
def withModMenu = !modmenuVersion.isEmpty()

if (withModMenu) {
    sourceSets.main.java.srcDir 'src/modmenu/java'
}

repositories {
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // No mappings: 26.x ships unobfuscated with parameter names.

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    if (withModMenu) {
        compileOnly "com.terraformersmc:modmenu:${modmenuVersion}"
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'withModMenu', withModMenu

    filesMatching('fabric.mod.json') {
        expand version: project.version,
                modmenu_entrypoint: withModMenu
                        ? ',\n      "modmenu": ["dev.sosoph.viewmodel.ModMenuIntegration"]'
                        : ''
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
