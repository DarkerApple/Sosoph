<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#eef4fb" />
<title>Sosoph</title>
<meta name="description" content="A four-key rhythm game with coloured notes and a live-synthesised soundtrack." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2300c8b4'/%3E%3Crect x='6' y='13' width='20' height='6' rx='3' fill='white'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<canvas id="stage"></canvas>

<main id="ui">

  <!-- ----------------------------------------------------- song select -->
  <section class="screen is-active" id="screen-select">
    <header class="top">
      <div class="brand">Sosoph</div>
      <nav class="top-nav">
        <a class="chip-btn" href="editor.html">Editor</a>
        <button class="chip-btn" id="btn-settings" type="button">Settings</button>
      </nav>
    </header>

    <div class="select">
      <ul class="songs" id="song-list" role="listbox" aria-label="Songs"></ul>

      <aside class="detail card" id="detail">
        <div class="detail-head">
          <span class="unit" id="d-unit"></span>
          <h2 id="d-title">—</h2>
          <p id="d-artist">—</p>
        </div>

        <div class="diffs" id="d-diffs" role="tablist" aria-label="Difficulty"></div>

        <dl class="stats">
          <div><dt>BPM</dt><dd id="d-bpm">—</dd></div>
          <div><dt>Notes</dt><dd id="d-notes">—</dd></div>
          <div><dt>Colour</dt><dd id="d-colored">—</dd></div>
          <div><dt>Length</dt><dd id="d-length">—</dd></div>
        </dl>

        <div class="best" id="d-best"><span>Best</span><b>not played yet</b></div>

        <button class="btn primary big" id="btn-play" type="button">Play</button>
        <p class="hint">
          <kbd>D</kbd><kbd>F</kbd><kbd>J</kbd><kbd>K</kbd> lanes ·
          <kbd>C</kbd><kbd>V</kbd><kbd>N</kbd><kbd>M</kbd> colours
        </p>
      </aside>
    </div>
  </section>

  <!-- -------------------------------------------------------- settings -->
  <section class="screen" id="screen-settings">
    <div class="card sheet">
      <header class="sheet-head">
        <h2>Settings</h2>
        <button class="chip-btn" id="btn-close-settings" type="button">Done</button>
      </header>

      <div class="sheet-body">
        <label class="row" for="set-speed">
          <span>Note speed</span>
          <input type="range" id="set-speed" min="1" max="4" step="0.1" />
          <output id="out-speed"></output>
        </label>

        <label class="row" for="set-offset">
          <span>Audio offset<em>negative if you hit late</em></span>
          <input type="range" id="set-offset" min="-150" max="150" step="1" />
          <output id="out-offset"></output>
        </label>

        <label class="row" for="set-volume">
          <span>Music volume</span>
          <input type="range" id="set-volume" min="0" max="1" step="0.01" />
          <output id="out-volume"></output>
        </label>

        <label class="row" for="set-hit">
          <span>Hit sound</span>
          <input type="range" id="set-hit" min="0" max="1" step="0.01" />
          <output id="out-hit"></output>
        </label>

        <label class="row" for="set-effects">
          <span>Effects</span>
          <input type="range" id="set-effects" min="0" max="1.4" step="0.1" />
          <output id="out-effects"></output>
        </label>

        <label class="row switch-row" for="set-colors">
          <span>Colour notes<em>off plays every note on the lane keys</em></span>
          <input type="checkbox" id="set-colors" />
          <i class="switch" aria-hidden="true"></i>
        </label>

        <label class="row switch-row" for="set-auto">
          <span>Autoplay<em>watch a perfect run</em></span>
          <input type="checkbox" id="set-auto" />
          <i class="switch" aria-hidden="true"></i>
        </label>

        <div class="group">
          <div class="group-head"><h3>Keys</h3><button class="chip-btn" id="btn-reset-keys" type="button">Reset</button></div>
          <div class="keygrid" id="keygrid"></div>
        </div>

        <div class="group">
          <div class="group-head"><h3>Note colours</h3><button class="chip-btn" id="btn-reset-colors" type="button">Reset</button></div>
          <div class="colorgrid" id="colorgrid"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ----------------------------------------------------------- pause -->
  <section class="screen dim" id="screen-pause">
    <div class="card pause">
      <h2>Paused</h2>
      <div class="actions column">
        <button class="btn primary" id="btn-resume" type="button">Resume</button>
        <button class="btn" id="btn-restart" type="button">Restart</button>
        <button class="btn ghost" id="btn-quit" type="button">Quit</button>
      </div>
    </div>
  </section>

  <!-- --------------------------------------------------------- results -->
  <section class="screen dim" id="screen-result">
    <div class="card result">
      <div class="grade" id="res-grade">S</div>
      <div class="res-banner" id="res-banner"></div>
      <div class="res-song" id="res-song">—</div>
      <div class="res-score" id="res-score">0</div>
      <div class="res-acc" id="res-acc">0.00%</div>

      <ul class="tally">
        <li style="--c:#ffd75e"><span>Perfect</span><b id="res-perfect">0</b></li>
        <li style="--c:#5fe0c4"><span>Great</span><b id="res-great">0</b></li>
        <li style="--c:#6fb7ff"><span>Good</span><b id="res-good">0</b></li>
        <li style="--c:#ff7d95"><span>Miss</span><b id="res-miss">0</b></li>
        <li style="--c:#b45cf0"><span>Max combo</span><b id="res-combo">0</b></li>
      </ul>

      <div class="actions">
        <button class="btn primary" id="btn-retry" type="button">Retry</button>
        <button class="btn ghost" id="btn-back" type="button">Song list</button>
      </div>
    </div>
  </section>

</main>

<script type="module" src="js/main.js"></script>
</body>
</html>
